<!DOCTYPE html>
<html>
<head>
  <title>QR kodai ir įrenginiai</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }

    .city-tabs {
      display: flex;
      gap: 12px;
      background: #f0f2f5;
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      margin-bottom: 20px;
      padding: 10px;
    }

    .city-tab {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background-color: transparent;
      color: #217dbb;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .city-tab:hover { background: rgba(58, 102, 143, 0.15); transform: translateY(-1px); }
    .city-tab.active { background-color: #3498db; color: #ffffff; transform: none; }

    #filterDiv {
      display: none;
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .filter-field { display: flex; flex-direction: column; gap: 4px; }
    .filter-field label { font-size: 13px; font-weight: 600; color: #444; }
    .filter-field select, .filter-field input {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      color: #333;
      outline: none;
      transition: border 0.2s;
    }
    .filter-field select:focus, .filter-field input:focus { border-color: #3498db; }
    .filter-actions { display: flex; gap: 8px; margin-top: 14px; }

    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; word-wrap: break-word; }
    th:nth-child(1), td:nth-child(1) { width: 13%; }
    th:nth-child(2), td:nth-child(2) { width: 12%; }
    th:nth-child(3), td:nth-child(3) { width: 18%; }
    th:nth-child(4), td:nth-child(4) { width: 20%; }
    th:nth-child(5), td:nth-child(5) { width: 12%; }
    th:nth-child(6), td:nth-child(6) { width: 25%; }

    button { margin: 5px 0; padding: 5px 10px; cursor: pointer; }
    #bulkQrForm { margin-bottom: 10px; }
    input[type="number"] { padding: 5px; margin-right: 5px; width: 100px; }

    .qr-container { display: flex; justify-content: center; align-items: center; }
    .qr-container canvas, .qr-container img { max-width: 100px; max-height: 100px; }

    #message {
      margin: 10px 0;
      padding: 8px 12px;
      border-radius: 5px;
      display: none;
    }
    #message.success { background-color: #d4edda; color: #155724; }
    #message.error   { background-color: #f8d7da; color: #721c24; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 { margin-top: 0; }
    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      box-sizing: border-box;

      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      color: #333;
      outline: none;
    }
    .modal-content textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      padding: 8px;
      margin: 10px 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .modal-buttons button { flex: 1; padding: 10px; }

    /* QR delete button - distinct style */
    .btn-qr-delete {
      background-color: #3498db;
      color: white;
    }
    .btn-qr-delete:hover {
      background-color: #217dbb;
    }
  </style>
</head>
<body>

  <div class="city-tabs" id="cityTabs"></div>

  <h1>QR kodai ir įrenginiai</h1>

  <div id="message"></div>

  <div id="bulkQrForm">
    <input type="number" id="qrCount" placeholder="QR kiekis" min="1" />
    <button onclick="createBulkQR()">Sukurti QR kodus</button>
    <button onclick="toggleFilters()">Filtruoti</button>
    <button class="reset-btn" onclick="window.location.href='index.html'">Grįžti</button>
  </div>

  <div id="filterDiv">
    <div class="filter-grid">
      <div class="filter-field">
        <label>Įrenginys:</label>
        <input type="text" id="filterDevice" placeholder="Ieškoti įrenginio..." oninput="applyFilters()">
      </div>
      <div class="filter-field">
        <label>Priskirtas:</label>
        <select id="filterAssigned" onchange="applyFilters()">
          <option value="">Visi</option>
          <option value="yes">Priskirtas</option>
          <option value="no">Nepriskirtas</option>
        </select>
      </div>
    </div>
  </div>

  <table id="qrcodes">
    <tr>
      <th>QR kodas</th>
      <th>QR vaizdas</th>
      <th>Įrenginio pavadinimas</th>
      <th>Aprašymas</th>
      <th>Miestas</th>
      <th>Veiksmai</th>
    </tr>
  </table>

  <!-- Assign Device Modal -->
  <div id="assignModal" class="modal">
    <div class="modal-content">
      <h3>Priskirti įrenginį</h3>
      <input type="text" id="deviceNameInput" placeholder="Įrenginio pavadinimas" />
        <textarea id="deviceDescriptionInput" placeholder="Aprašymas" rows="4"></textarea>      <select id="citySelect">
        <option value="">Pasirinkite miestą...</option>
      </select>
      <div class="modal-buttons">
        <button onclick="confirmAssign()">Patvirtinti</button>
        <button class="reset-btn" onclick="closeModal('assignModal')">Atšaukti</button>
      </div>
    </div>
  </div>

  <!-- Change City Modal -->
  <div id="changeCityModal" class="modal">
    <div class="modal-content">
      <h3>Keisti miestą</h3>
      <p id="currentCityText"></p>
      <select id="citySelectChange">
        <option value="">Pasirinkite naują miestą...</option>
      </select>
      <div class="modal-buttons">
        <button onclick="confirmChangeCity()">Patvirtinti</button>
        <button class="reset-btn" onclick="closeModal('changeCityModal')">Atšaukti</button>
      </div>
    </div>
  </div>

  <script>
    const messageEl = document.getElementById('message');
    const PUBLIC_BASE_URL = window.location.origin;
    let currentQrId = null;
    let cities = [];
    let allQRCodes = [];
    let currentCityId = '';
    let isSuperAdmin = false; // set after auth check
    let isEditing = false;

    function showMessage(text, type = 'success') {
      messageEl.textContent = text;
      messageEl.className = type === 'success' ? 'success' : 'error';
      messageEl.style.display = 'block';
      setTimeout(() => messageEl.style.display = 'none', 4000);
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
      currentQrId = null;
    }

    function generateQRCode(containerId, qrCode) {
      const url = `${PUBLIC_BASE_URL}/scan?qrId=${qrCode}`;
      const container = document.getElementById(containerId);
      if (!container) return;
      new QRCode(container, {
        text: url,
        width: 100,
        height: 100,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function downloadQR(qrCode) {
      const url = `${PUBLIC_BASE_URL}/scan?qrId=${qrCode}`;
      const tempDiv = document.createElement('div');
      tempDiv.style.position = 'absolute';
      tempDiv.style.left = '-9999px';
      tempDiv.style.top = '-9999px';
      document.body.appendChild(tempDiv);

      const finalSize = 1000;   // final PNG size
      const border = 24;        // slight white border
      const qrSize = finalSize - (border * 2);

      new QRCode(tempDiv, {
        text: url,
        width: qrSize,
        height: qrSize,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const sourceCanvas = tempDiv.querySelector('canvas');
        const sourceImg = tempDiv.querySelector('img');

        if (!sourceCanvas && !sourceImg) {
          document.body.removeChild(tempDiv);
          return;
        }

        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = finalSize;
        finalCanvas.height = finalSize;

        const ctx = finalCanvas.getContext('2d');

        // white background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, finalSize, finalSize);

        const finishDownload = () => {
          const link = document.createElement('a');
          link.download = `${qrCode}.png`;
          link.href = finalCanvas.toDataURL('image/png');
          link.click();
          document.body.removeChild(tempDiv);
        };

        if (sourceCanvas) {
          ctx.drawImage(sourceCanvas, border, border, qrSize, qrSize);
          finishDownload();
          return;
        }

        // fallback if library rendered as <img>
        sourceImg.onload = () => {
          ctx.drawImage(sourceImg, border, border, qrSize, qrSize);
          finishDownload();
        };

        if (sourceImg.complete) {
          ctx.drawImage(sourceImg, border, border, qrSize, qrSize);
          finishDownload();
        }
      }, 200);
    }

    async function loadCities() {
      const res = await fetch('/cities');
      cities = await res.json();

      const cityTabs = document.getElementById('cityTabs');
      cityTabs.innerHTML = '';

      cities.forEach((city) => {
        const btn = document.createElement('button');
        btn.className = 'city-tab';
        btn.dataset.city = city.id;
        btn.textContent = city.code;
        cityTabs.appendChild(btn);
        btn.addEventListener('click', () => {
          document.querySelectorAll('.city-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCityId = city.id;
          applyFilters();
        });
      });

      const allBtn = document.createElement('button');
      allBtn.className = 'city-tab active';
      allBtn.textContent = 'VISI';
      cityTabs.appendChild(allBtn);
      allBtn.addEventListener('click', () => {
        document.querySelectorAll('.city-tab').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        currentCityId = '';
        applyFilters();
      });

      const citySelect = document.getElementById('citySelect');
      const citySelectChange = document.getElementById('citySelectChange');
      citySelect.innerHTML = '<option value="">Pasirinkite miestą...</option>';
      citySelectChange.innerHTML = '<option value="">Pasirinkite naują miestą...</option>';
      cities.forEach(c => {
        citySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        citySelectChange.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }

    async function loadAllQRCodes() {
      const res = await fetch('/qrcodes');
      allQRCodes = await res.json();
      applyFilters();
    }

    function applyFilters() {
      const searchVal = document.getElementById('filterDevice').value.toLowerCase().trim();
      const assignedVal = document.getElementById('filterAssigned').value;

      const filtered = allQRCodes.filter(q => {
        const qrCode = String(q.qr_code || '').toLowerCase();
        const deviceName = String(q.device_name || '').toLowerCase();

        const matchCity = currentCityId
          ? String(q.city_id) === String(currentCityId)
          : true;

        const matchSearch = searchVal
          ? deviceName.includes(searchVal) || qrCode.includes(searchVal)
          : true;

        const matchAssigned =
          assignedVal === 'yes' ? !!q.device_id :
          assignedVal === 'no'  ? !q.device_id  : true;

        return matchCity && matchSearch && matchAssigned;
      });

      renderTable(filtered);
    }

    function resetFilters() {
      document.getElementById('filterDevice').value = '';
      document.getElementById('filterAssigned').value = '';
      applyFilters();
    }

    function toggleFilters() {
      const filterDiv = document.getElementById('filterDiv');
      filterDiv.style.display =
        filterDiv.style.display === 'none' || !filterDiv.style.display ? 'block' : 'none';
    }

    function renderTable(codes) {
      const table = document.getElementById('qrcodes');
      table.innerHTML = `
        <tr>
          <th>QR kodas</th>
          <th>QR vaizdas</th>
          <th>Įrenginio pavadinimas</th>
          <th>Aprašymas</th>
          <th>Miestas</th>
          <th>Veiksmai</th>
        </tr>
      `;

      codes.forEach(q => {
        const hasDevice = !!q.device_id;
        const cityName = q.city_name || 'Nepasirinktas';
        const containerId = `qr-${q.qr_id}`;

        // QR delete button shown ONLY for superadmin
        const qrDeleteBtn = isSuperAdmin
          ? `<button class="btn-qr-delete" onclick="deleteQRCode(${q.qr_id})">Ištrinti QR</button><br>`
          : '';

        const actionsHtml = hasDevice
          ? `
            <button onclick="openRules(${q.device_id})">Taisyklės</button><br>
            <button onclick="editDevice(${q.qr_id}, ${q.device_id}, \`${(q.device_name || '').replace(/`/g, '\\`')}\`, \`${(q.description || '').replace(/`/g, '\\`')}\`, ${q.city_id || 'null'})">Redaguoti</button><br>            <button class="reset-btn" onclick="deleteDevice(${q.device_id})">Ištrinti įrenginį</button><br>
            <button onclick="downloadQR('${q.qr_code}')">Parsisiųsti QR</button><br>
            ${qrDeleteBtn}
          `
          : `
            <button onclick="assignDevice(${q.qr_id})">Priskirti įrenginį</button><br>
            <button onclick="downloadQR('${q.qr_code}')">Parsisiųsti QR</button><br>
            ${qrDeleteBtn}
          `;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${q.qr_code}</td>
          <td><div class="qr-container" id="${containerId}"></div></td>
          <td>${q.device_name || ''}</td>
          <td>${q.description || ''}</td>
          <td>${cityName}</td>
          <td style="white-space: nowrap;">${actionsHtml}</td>
        `;
        table.appendChild(row);
        setTimeout(() => generateQRCode(containerId, q.qr_code), 0);
      });
    }

    async function createBulkQR() {
      const count = parseInt(document.getElementById('qrCount').value);
      if (!count || count <= 0) return showMessage("Įveskite teisingą kiekį", "error");

      try {
        const res = await fetch('/qrcodes/bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count })
        });
        if (res.ok) {
          const data = await res.json();
          await loadAllQRCodes();
          showMessage(data.message, "success");
        } else {
          showMessage("Klaida: " + await res.text(), "error");
        }
      } catch (err) {
        showMessage("Klaida kuriant QR kodus", "error");
      }
    }

    function assignDevice(qr_id) {
      isEditing = false;
      currentQrId = qr_id;

      document.getElementById('deviceNameInput').value = '';
      document.getElementById('deviceDescriptionInput').value = '';
      document.getElementById('citySelect').value = '';

      document.querySelector('#assignModal h3').textContent = 'Priskirti įrenginį';
      document.querySelector('#assignModal button').textContent = 'Patvirtinti';

      document.getElementById('assignModal').style.display = 'block';
    }


    function editDevice(qrId, deviceId, deviceName, description, cityId) {
      isEditing = true;
      currentQrId = qrId;

      document.getElementById('deviceNameInput').value = deviceName || '';
      document.getElementById('deviceDescriptionInput').value = description || '';
      document.getElementById('citySelect').value = cityId || '';

      document.querySelector('#assignModal h3').textContent = 'Redaguoti įrenginį';
      document.querySelector('#assignModal button').textContent = 'Išsaugoti';

      document.getElementById('assignModal').style.display = 'block';
    }

    async function confirmAssign() {
      const device_name = document.getElementById('deviceNameInput').value.trim();
      const description = document.getElementById('deviceDescriptionInput').value.trim();
      const city_id = document.getElementById('citySelect').value;
      if (!device_name) return showMessage("Įveskite įrenginio pavadinimą", "error");
      if (!city_id) return showMessage("Pasirinkite miestą", "error");

      try {
            const endpoint = isEditing
              ? `/qrcodes/${currentQrId}/edit_device`
              : `/qrcodes/${currentQrId}/assign_device`;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                device_name,
                description,
                city_id: parseInt(city_id)
              })
            });
        if (res.ok) {
          await loadAllQRCodes();
          showMessage(`Įrenginys "${device_name}" priskirtas`, "success");
          closeModal('assignModal');
        } else {
          showMessage("Klaida: " + await res.text(), "error");
        }
      } catch (err) {
        showMessage("Klaida priskiriant įrenginį", "error");
      }
    }

    function changeCity(qr_id, currentCity) {
      currentQrId = qr_id;
      document.getElementById('currentCityText').textContent = `Dabartinis miestas: ${currentCity}`;
      document.getElementById('citySelectChange').value = '';
      document.getElementById('changeCityModal').style.display = 'block';
    }

    async function confirmChangeCity() {
      const city_id = document.getElementById('citySelectChange').value;
      if (!city_id) return showMessage("Pasirinkite miestą", "error");

      try {
        const res = await fetch(`/qrcodes/${currentQrId}/change_city`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city_id: parseInt(city_id) })
        });
        if (res.ok) {
          await loadAllQRCodes();
          showMessage("Miestas pakeistas", "success");
          closeModal('changeCityModal');
        } else {
          showMessage("Klaida: " + await res.text(), "error");
        }
      } catch (err) {
        showMessage("Klaida keičiant miestą", "error");
      }
    }

    function openRules(deviceId) {
      window.location.href = `device.html?id=${deviceId}`;
    }

    async function deleteDevice(deviceId) {
      if (!confirm("Ar tikrai norite ištrinti įrenginį?")) return;
      try {
        const res = await fetch(`/devices/${deviceId}`, { method: 'DELETE' });
        if (res.ok) {
          await loadAllQRCodes();
          showMessage("Įrenginys ištrintas", "success");
        } else {
          showMessage("Klaida: " + await res.text(), "error");
        }
      } catch (err) {
        showMessage("Klaida trinant įrenginį", "error");
      }
    }

    // Only superadmin can call this — button is hidden for others
    async function deleteQRCode(qrId) {
      if (!confirm("Ar tikrai norite ištrinti šį QR kodą? Tai pašalins ir susietą įrenginį!")) return;
      try {
        const res = await fetch(`/qrcodes/${qrId}`, { method: 'DELETE' });
        if (res.ok) {
          await loadAllQRCodes();
          showMessage("QR kodas ištrintas", "success");
        } else {
          showMessage("Klaida: " + await res.text(), "error");
        }
      } catch (err) {
        showMessage("Klaida trinant QR kodą", "error");
      }
    }

    async function init() {
      // Check auth and get role before rendering
      const authRes = await fetch('/auth/status');
      const authData = await authRes.json();

      if (!authData.authenticated) {
        window.location.href = '/login.html';
        return;
      }

      // Set superadmin flag — controls whether delete QR button appears
      isSuperAdmin = authData.user.role === 'superadmin';

      await loadCities();
      await loadAllQRCodes();
    }

    init();
  </script>
</body>
</html>
