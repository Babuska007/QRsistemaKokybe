<!DOCTYPE html>
<html>
<head>
  <title>QR kodai ir įrenginiai</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }

    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
      word-wrap: break-word;
    }

    th:nth-child(1), td:nth-child(1) { width: 20%; } /* QR kodas */
    th:nth-child(2), td:nth-child(2) { width: 30%; } /* Vaizdas */
    th:nth-child(3), td:nth-child(3) { width: 30%; } /* Įrenginio pavadinimas */
    th:nth-child(4), td:nth-child(4) { width: 20%; } /* Veiksmai */

    button { margin: 5px 0; padding: 5px 10px; cursor: pointer; }
    #bulkQrForm { margin-bottom: 10px; }
    input { padding: 5px; margin-right: 5px; width: 100px; }
    img { display: block; margin: 0 auto; max-width: 100%; }

    #message {
      margin: 10px 0;
      padding: 8px 12px;
      border-radius: 5px;
      display: none;
    }
    #message.success { background-color: #d4edda; color: #155724; }
    #message.error   { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>QR kodai ir įrenginiai</h1>

  <div id="message"></div>

  <!-- Bulk QR form -->
  <div id="bulkQrForm">
    <input type="number" id="qrCount" placeholder="QR kiekis" min="1" />
    <button onclick="createBulkQR()">Sukurti QR kodus</button>
    <button class="reset-btn" onclick="window.location.href='index.html'">Grįžti</button>
  </div>

  <table id="qrcodes">
    <tr>
      <th>QR kodas</th>
      <th>QR vaizdas</th>
      <th>Įrenginio pavadinimas</th>
      <th>Veiksmai</th>
    </tr>
  </table>

  <script>
    const messageEl = document.getElementById('message');

    function showMessage(text, type='success') {
      messageEl.textContent = text;
      messageEl.className = type === 'success' ? 'success' : 'error';
      messageEl.style.display = 'block';
      setTimeout(() => messageEl.style.display = 'none', 4000);
    }

    async function loadQRCodes() {
      try {
        const res = await fetch('/qrcodes');
        const codes = await res.json();
        const table = document.getElementById('qrcodes');

        table.innerHTML = `
          <tr>
            <th>QR kodas</th>
            <th>QR vaizdas</th>
            <th>Įrenginio pavadinimas</th>
            <th>Veiksmai</th>
          </tr>
        `;

        codes.forEach(q => {
          const hasDevice = !!q.device_id;

          const actionsHtml = hasDevice
            ? `
              <button onclick="openRules(${q.device_id})">Taisyklės</button><br>
              <button class="reset-btn" onclick="deleteDevice(${q.device_id})">Ištrinti įrenginį</button><br>
              <a href="${q.qr_image}" download="${q.qr_code}.png">
                <button>Parsisiųsti QR</button>
              </a>
            `
            : `
              <button onclick="assignDevice(${q.qr_id})">Priskirti įrenginį</button><br>
              <a href="${q.qr_image}" download="${q.qr_code}.png">
                <button>Parsisiųsti QR</button>
              </a>
            `;

          table.innerHTML += `
            <tr>
              <td>${q.qr_code}</td>
              <td>
                <a href="${q.qr_image}" target="_blank">
                  <img src="${q.qr_image}" width="100" />
                </a>
              </td>
              <td>${q.device_name || ''}</td>
              <td style="white-space: nowrap;">${actionsHtml}</td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Error loading QR codes:", err);
        showMessage("Klaida įkeliant QR kodus", "error");
      }
    }

    async function createBulkQR() {
      const count = parseInt(document.getElementById('qrCount').value);
      if (!count || count <= 0) return showMessage("Įveskite teisingą kiekį", "error");

      try {
        const res = await fetch('/qrcodes/bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ count })
        });
        if (res.ok) {
          const data = await res.json();
          await loadQRCodes();
          showMessage(data.message, "success");
        } else {
          const text = await res.text();
          showMessage("Klaida: " + text, "error");
        }
      } catch (err) {
        console.error("Error creating QR codes:", err);
        showMessage("Klaida kuriant QR kodus", "error");
      }
    }

    // priskiriame naują įrenginį šiam QR
    async function assignDevice(qr_id) {
      const device_name = prompt("Įveskite įrenginio pavadinimą šiam QR kodui:");
      if (!device_name) return;

      try {
        const res = await fetch(`/qrcodes/${qr_id}/assign_device`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_name })
        });
        if (res.ok) {
          await loadQRCodes();
          showMessage(`Įrenginys "${device_name}" priskirtas QR kodui`, "success");
        } else {
          const text = await res.text();
          showMessage("Klaida: " + text, "error");
        }
      } catch (err) {
        console.error("Error assigning device:", err);
        showMessage("Klaida priskiriant įrenginį", "error");
      }
    }

    // atidaryti taisyklių puslapį šiam įrenginiui
    function openRules(deviceId) {
      window.location.href = `device.html?id=${deviceId}`;
    }

    // ištrinti įrenginį – po to tas QR vėl bus „laisvas“
    async function deleteDevice(deviceId) {
      if (!confirm("Ar tikrai norite ištrinti įrenginį?")) return;

      try {
        const res = await fetch(`/devices/${deviceId}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          await loadQRCodes();
          showMessage("Įrenginys ištrintas", "success");
        } else {
          const text = await res.text();
          showMessage("Klaida: " + text, "error");
        }
      } catch (err) {
        console.error("Error deleting device:", err);
        showMessage("Klaida trinant įrenginį", "error");
      }
    }

    loadQRCodes();
  </script>
</body>
</html>
