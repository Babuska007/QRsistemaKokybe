<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Administratorių valdymas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }
    .modal-content {
      background: white;
      margin: 5% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
    }
    .modal-content h2 { margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin: 0;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-superadmin { background: #e74c3c; color: white; }
    .badge-admin { background: #f39c12; color: white; }
    .badge-user { background: #95a5a6; color: white; }
    .badge-active { background: #27ae60; color: white; }
    .badge-inactive { background: #95a5a6; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>Administratorių valdymas</h1>

  <div style="margin-bottom: 20px;">
    <button class="add-btn" onclick="showCreateModal()">Sukurti vartotoją</button>
    <button onclick="location.href='index.html'">Grįžti</button>
  </div>

  <div id="message" style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 20px;"></div>

  <div class="card">
    <table id="usersTable">
      <thead>
        <tr>
          <th>Vartotojo vardas</th>
          <th>El. paštas</th>
          <th>Rolė</th>
          <th>Statusas</th>
          <th>Sukurta</th>
          <th>Paskutinis prisijungimas</th>
          <th>Veiksmai</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Create User Modal -->
<div id="createModal" class="modal">
  <div class="modal-content">
    <h2>Sukurti vartotoją</h2>
    <form id="createForm" onsubmit="createUser(event)">
      <div class="form-group">
        <label>Vartotojo vardas *</label>
        <input type="text" id="newUsername" required>
      </div>
      <div class="form-group">
        <label>El. paštas *</label>
        <input type="email" id="newEmail" required>
      </div>
      <div class="form-group">
        <label>Slaptažodis *</label>
        <input type="password" id="newPassword" required minlength="6">
      </div>
      <div class="form-group">
        <label>Rolė *</label>
        <select id="newRole" required>
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="superadmin">Superadmin</option>
        </select>
      </div>
      <div class="btn-group">
        <button type="submit">Sukurti</button>
        <button type="button" class="reset-btn" onclick="closeModal('createModal')">Atšaukti</button>
      </div>
    </form>
  </div>
</div>

<!-- Reset Password Modal — NO <form>, buttons are type="button" -->
<div id="resetModal" class="modal">
  <div class="modal-content">
    <h2>Keisti slaptažodį</h2>
    <input type="hidden" id="resetUserId">
    <div class="form-group">
      <label>Naujas slaptažodis *</label>
      <!-- KEY FIX: id is "resetNewPassword", not "resetPassword" -->
      <input type="password" id="resetNewPassword" minlength="6">
    </div>
    <div class="btn-group">
      <button type="button" onclick="doResetPassword()">Pakeisti</button>
      <button type="button" class="reset-btn" onclick="closeModal('resetModal')">Atšaukti</button>
    </div>
  </div>
</div>

<script>
  const msgEl = document.getElementById('message');

  function showMessage(text, type = 'success') {
    msgEl.textContent = text;
    msgEl.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
    msgEl.style.color = type === 'success' ? '#155724' : '#721c24';
    msgEl.style.display = 'block';
    setTimeout(() => msgEl.style.display = 'none', 4000);
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function showCreateModal() {
    document.getElementById('createForm').reset();
    document.getElementById('createModal').style.display = 'block';
  }

  async function loadUsers() {
    try {
      const res = await fetch('/admin/users');
      const users = await res.json();
      const tbody = document.querySelector('#usersTable tbody');
      tbody.innerHTML = '';
      users.forEach(u => {
        const roleClass = `badge-${u.role}`;
        const statusClass = u.is_active ? 'badge-active' : 'badge-inactive';
        tbody.innerHTML += `
          <tr>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td><span class="badge ${roleClass}">${u.role.toUpperCase()}</span></td>
            <td><span class="badge ${statusClass}">${u.is_active ? 'Aktyvus' : 'Neaktyvus'}</span></td>
            <td>${u.created_at}</td>
            <td>${u.last_login || '—'}</td>
            <td>
              <button onclick="showResetModal(${u.id})">Keisti slaptažodį</button>
              <button onclick="toggleStatus(${u.id})">${u.is_active ? 'Deaktyvuoti' : 'Aktyvuoti'}</button>
              <button class="btn-danger" onclick="deleteUser(${u.id})">Ištrinti</button>
            </td>
          </tr>
        `;
      });
    } catch (err) {
      console.error(err);
      showMessage('Klaida įkeliant vartotojus', 'error');
    }
  }

  async function createUser(event) {
    event.preventDefault();
    const data = {
      username: document.getElementById('newUsername').value,
      email: document.getElementById('newEmail').value,
      password: document.getElementById('newPassword').value,
      role: document.getElementById('newRole').value
    };
    try {
      const res = await fetch('/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        closeModal('createModal');
        loadUsers();
        showMessage('Vartotojas sukurtas');
      } else {
        const text = await res.text();
        showMessage(text, 'error');
      }
    } catch (err) {
      console.error(err);
      showMessage('Klaida kuriant vartotoją', 'error');
    }
  }

  function showResetModal(userId) {
    document.getElementById('resetUserId').value = userId;
    document.getElementById('resetNewPassword').value = '';
    document.getElementById('resetModal').style.display = 'block';
  }

  // Renamed to doResetPassword — completely avoids any naming conflict
  async function doResetPassword() {
    const userId = document.getElementById('resetUserId').value;
    const newPassword = document.getElementById('resetNewPassword').value;

    if (!newPassword || newPassword.length < 6) {
      showMessage('Slaptažodis turi būti bent 6 simbolių', 'error');
      return;
    }

    try {
      const res = await fetch(`/admin/users/${userId}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword })
      });
      const text = await res.text();
      if (res.ok) {
        closeModal('resetModal');
        showMessage('Slaptažodis pakeistas');
      } else {
        showMessage(text, 'error');
      }
    } catch (err) {
      console.error(err);
      showMessage('Klaida keičiant slaptažodį', 'error');
    }
  }

  async function toggleStatus(userId) {
    try {
      const res = await fetch(`/admin/users/${userId}/toggle-status`, { method: 'POST' });
      if (res.ok) {
        loadUsers();
        showMessage('Vartotojo statusas pakeistas');
      } else {
        showMessage('Klaida', 'error');
      }
    } catch (err) {
      console.error(err);
      showMessage('Klaida', 'error');
    }
  }

  async function deleteUser(userId) {
    if (!confirm('Ar tikrai norite ištrinti šį vartotoją?')) return;
    try {
      const res = await fetch(`/admin/users/${userId}`, { method: 'DELETE' });
      if (res.ok) {
        loadUsers();
        showMessage('Vartotojas ištrintas');
      } else {
        const text = await res.text();
        showMessage(text, 'error');
      }
    } catch (err) {
      console.error(err);
      showMessage('Klaida trinant vartotoją', 'error');
    }
  }

  async function logout() {
    await fetch('/auth/logout', { method: 'POST' });
    window.location.href = '/login.html';
  }

  fetch('/auth/status')
    .then(res => res.json())
    .then(data => {
      if (!data.authenticated || data.user.role !== 'superadmin') {
        window.location.href = '/login.html';
      } else {
        loadUsers();
      }
    });
</script>

</body>
</html>
