<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const bcrypt = require(&#039;bcrypt&#039;);
const pool = require(&#039;../config/database&#039;);

// Login
router.post(&#039;/login&#039;, async (req, res) =&gt; {
  const { username, password } = req.body;

  if (!username || !password) {
    return res.status(400).json({ success: false, message: &#039;Įveskite vartotojo vardą ir slaptažodį&#039; });
  }

  try {
    const [users] = await pool.execute(
      &#039;SELECT * FROM admins WHERE username = ? AND is_active = 1&#039;,
      [username]
    );

    if (users.length === 0) {
      return res.status(401).json({ success: false, message: &#039;Neteisingas vartotojo vardas arba slaptažodis&#039; });
    }

    const user = users[0];
    const isValid = await bcrypt.compare(password, user.password_hash);

    if (!isValid) {
      return res.status(401).json({ success: false, message: &#039;Neteisingas vartotojo vardas arba slaptažodis&#039; });
    }

    // Update last login
    await pool.execute(&#039;UPDATE admins SET last_login = NOW() WHERE id = ?&#039;, [user.id]);

    // Set session
    req.session.user = {
      id: user.id,
      username: user.username,
      email: user.email,
      role: user.role
    };

    res.json({ success: true, role: user.role });
  } catch (err) {
    console.error(err);
    res.status(500).json({ success: false, message: &#039;Serverio klaida&#039; });
  }
});

// Logout
router.post(&#039;/logout&#039;, (req, res) =&gt; {
  req.session.destroy((err) =&gt; {
    if (err) {
      return res.status(500).json({ success: false, message: &#039;Logout failed&#039; });
    }
    res.clearCookie(&#039;connect.sid&#039;); // Clear session cookie
    res.json({ success: true });
  });
});

// Check auth status
router.get(&#039;/status&#039;, (req, res) =&gt; {
  if (req.session.user) {
    res.json({ authenticated: true, user: req.session.user });
  } else {
    res.json({ authenticated: false });
  }
});

module.exports = router;</textarea>
