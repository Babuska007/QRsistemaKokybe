<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const pool = require(&#039;../config/database&#039;);

// Get logs with filtering
router.get(&#039;/&#039;, async (req, res) =&gt; {
  try {
    const { deviceId, from, to, scanned, user, cityId } = req.query;

    let sql = `
      SELECT 
        s.scan_id,
        d.device_name,
        s.is_scanned,
        DATE_FORMAT(s.scan_timestamp, &#039;%Y-%m-%d %H:%i:%s&#039;) AS scan_timestamp,
        CONCAT(u.first_name, &#039; &#039;, u.last_name) AS user_name,
        c.name AS city_name,
        c.id AS city_id
      FROM scans s
      JOIN devices d ON s.device_id = d.id
      LEFT JOIN users u ON s.user_id = u.id
      LEFT JOIN cities c ON d.city_id = c.id
      WHERE 1=1
    `;

    const params = [];

    if (cityId) {
      sql += &quot; AND d.city_id = ?&quot;;
      params.push(cityId);
    }

    if (deviceId) {
      sql += &quot; AND d.id = ?&quot;;
      params.push(deviceId);
    }

    if (req.query.groupId) {
      sql += ` AND d.system_group_id = ?`;
      params.push(req.query.groupId);
    }

    if (user) {
      sql += &quot; AND CONCAT(COALESCE(u.first_name,&#039;&#039;), &#039; &#039;, COALESCE(u.last_name,&#039;&#039;)) = ?&quot;;
      params.push(user);
    }

    if (from) {
      sql += &quot; AND s.scan_timestamp &gt;= ?&quot;;
      params.push(from);
    }

    if (to) {
      sql += &quot; AND s.scan_timestamp &lt;= ?&quot;;
      params.push(to);
    }

    if (scanned === &#039;1&#039; || scanned === &#039;0&#039;) {
      sql += &quot; AND s.is_scanned = ?&quot;;
      params.push(Number(scanned));
    }

    sql += &quot; ORDER BY s.scan_timestamp DESC LIMIT 50&quot;;

    const [rows] = await pool.execute(sql, params);
    res.json(rows);
  } catch (err) {
    console.error(err);
    res.status(500).send(&quot;Error fetching logs&quot;);
  }
});

module.exports = router;</textarea>
